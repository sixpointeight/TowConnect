<svg viewBox="0 0 500 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Compact shield background -->
  <path d="M10 10 L50 10 Q55 10 55 15 L55 35 Q55 50 32.5 60 Q10 50 10 35 L10 15 Q10 10 10 10 Z" fill="#1e40af" stroke="#ea580c" stroke-width="2"/>
  
  <!-- Simplified tow truck icon -->
  <g transform="translate(12, 12)">
    <!-- Truck body -->
    <rect x="8" y="25" width="25" height="8" fill="#ffffff" rx="1"/>
    <!-- Truck cab -->
    <rect x="28" y="18" width="10" height="15" fill="#ffffff" rx="1"/>
    <!-- Windshield -->
    <rect x="29" y="19" width="8" height="6" fill="#e5e7eb" rx="1"/>
    <!-- Tow arm -->
    <path d="M5 28 L18 20 L18 22 L32 22 L32 24 L18 24 L18 26 Z" fill="#ea580c"/>
    <!-- Hook -->
    <circle cx="4" cy="29" r="1" fill="#ea580c"/>
    <!-- Wheels -->
    <circle cx="13" cy="36" r="3" fill="#374151"/>
    <circle cx="32" cy="36" r="3" fill="#374151"/>
    <!-- Wheel centers -->
    <circle cx="13" cy="36" r="1.5" fill="#6b7280"/>
    <circle cx="32" cy="36" r="1.5" fill="#6b7280"/>
  </g>
  
  <!-- Company name horizontal layout -->
  <text x="70" y="35" font-family="Inter, Arial Black, sans-serif" font-size="28" font-weight="900" fill="#1e40af" letter-spacing="-1px">501</text>
  <text x="135" y="35" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#374151" letter-spacing="1px">TOWING</text>
  <text x="135" y="52" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#ea580c" letter-spacing="0.5px">&amp; ROADSIDE</text>
  
  <!-- Service indicators -->
  <g transform="translate(280, 15)">
    <!-- 24/7 badge -->
    <rect x="0" y="0" width="50" height="16" fill="#ea580c" rx="8"/>
    <text x="25" y="11" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">24/7</text>
    
    <!-- Professional badge -->
    <rect x="0" y="20" width="50" height="14" fill="#1e40af" rx="7"/>
    <text x="25" y="29" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="600" fill="#ffffff" text-anchor="middle">PRO</text>
    
    <!-- Quality stars -->
    <g transform="translate(5, 40)">
      <polygon points="4,0 4.5,2 7,2 5,3.5 5.5,6 4,5 2.5,6 3,3.5 1,2 3.5,2" fill="#fbbf24" transform="scale(0.8)"/>
      <polygon points="12,0 12.5,2 15,2 13,3.5 13.5,6 12,5 10.5,6 11,3.5 9,2 11.5,2" fill="#fbbf24" transform="scale(0.8)"/>
      <polygon points="20,0 20.5,2 23,2 21,3.5 21.5,6 20,5 18.5,6 19,3.5 17,2 19.5,2" fill="#fbbf24" transform="scale(0.8)"/>
      <polygon points="28,0 28.5,2 31,2 29,3.5 29.5,6 28,5 26.5,6 27,3.5 25,2 27.5,2" fill="#fbbf24" transform="scale(0.8)"/>
      <polygon points="36,0 36.5,2 39,2 37,3.5 37.5,6 36,5 34.5,6 35,3.5 33,2 35.5,2" fill="#fbbf24" transform="scale(0.8)"/>
    </g>
  </g>
  
  <!-- Contact emphasis -->
  <g transform="translate(380, 15)">
    <rect x="0" y="0" width="100" height="50" fill="none" stroke="#ea580c" stroke-width="1" stroke-dasharray="3,3" rx="5" opacity="0.5"/>
    <text x="50" y="20" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">FAST RESPONSE</text>
    <text x="50" y="35" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#ea580c" text-anchor="middle">RELIABLE SERVICE</text>
  </g>
</svg>